            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "rate(process_cpu_seconds_total{job=\"recommendation-service\"}[1m])",
              "legendFormat": "{{instance}}",
              "refId": "A",
              "range": true
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "vector(0.1)",
              "legendFormat": "HPA target (50% of 200m)",
              "refId": "B",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Event-loop lag p99 per pod",
          "description": "The first saturation signal for a single-threaded Node process; it usually rises before CPU reaches the limit.",
          "id": 13,
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 14
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 0,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "nodejs_eventloop_lag_p99_seconds{job=\"recommendation-service\"}",
              "legendFormat": "{{instance}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "type": "row",
          "title": "Recommendation quality and experiment",
          "id": 14,
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "type": "timeseries",
          "title": "Feed source (fallback chain)",
          "description": "Which stage of personalized/similar -> popular -> static actually served each feed. A rise in static means the hot store is unavailable.",
          "id": 15,
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 23
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": {
                  "mode": "percent",
                  "group": "A"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "victoriametrics"
              },
              "editorMode": "code",
              "expr": "sum by (source) (rate(reco_feed_served_total[1m]))",
              "legendFormat": "{{source}}",
              "refId": "A",
              "range": true
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Distinct brands per home feed (A/B)",
          "description": "Treatment 'diverse' applies a brand cap during re-ranking; control keeps pure model order.",
          "id": 16,
