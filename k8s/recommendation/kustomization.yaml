apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Recommendation demo workload: Valkey hot store + Node.js/TypeScript feed service + HPA.
# The reverse-ETL seed Job (jobs/) and the k6 load generator (load/) are applied separately so
# they can be re-run, started, and stopped independently of the serving stack.
resources:
  - namespace.yaml
  - valkey.yaml
  - recommendation-service-configmap.yaml
  - recommendation-service-deployment.yaml
  - recommendation-service-service.yaml
  - recommendation-service-hpa.yaml
