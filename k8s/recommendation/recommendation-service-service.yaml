apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: service-launchpad-reco
  labels:
    app.kubernetes.io/name: recommendation-service
    app.kubernetes.io/part-of: service-launchpad
spec:
  selector:
    app.kubernetes.io/name: recommendation-service
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
# Headless Service for scraping. A ClusterIP name resolves to one virtual IP, so a static scrape
# target would hit a random pod each interval and per-pod series would flap as the HPA scales.
# A headless name resolves to every ready pod IP; vmagent's dns_sd_configs turns each into a target.
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service-metrics
  namespace: service-launchpad-reco
  labels:
    app.kubernetes.io/name: recommendation-service
    app.kubernetes.io/part-of: service-launchpad
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: recommendation-service
  ports:
    - name: http
      port: 8080
      targetPort: http
