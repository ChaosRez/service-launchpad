# Always-on k6 load generator.
#
# A Deployment rather than a Job: it is meant to run continuously as background traffic. k6 runs
# one constant-arrival-rate scenario for DURATION, exits, and the kubelet restarts it.
# Change the offered load with:
#   kubectl -n service-launchpad-reco set env deployment/k6-load-generator RATE=1500
# Stop it with:
#   kubectl -n service-launchpad-reco scale deployment/k6-load-generator --replicas=0
#
# The script comes from loadtests/k6/recommendation-service.js via the k6-recommendation-script
# ConfigMap (see k8s/recommendation/README.md for the create command).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k6-load-generator
  namespace: service-launchpad-reco
  labels:
    app.kubernetes.io/name: k6-load-generator
    app.kubernetes.io/component: load-generator
    app.kubernetes.io/part-of: service-launchpad
spec:
  replicas: 1
  strategy:
    type: Recreate # never run two generators at once during a config change
  selector:
    matchLabels:
      app.kubernetes.io/name: k6-load-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k6-load-generator
        app.kubernetes.io/component: load-generator
        app.kubernetes.io/part-of: service-launchpad
    spec:
      containers:
        - name: k6
          image: grafana/k6:1.3.0
          args:
            - run
            - --quiet
            - -o
            - experimental-prometheus-rw
            - /scripts/recommendation-service.js
          env:
            - name: RATE
              value: "300"
            - name: DURATION
              value: 24h
            - name: PRE_ALLOCATED_VUS
              value: "50"
            - name: MAX_VUS
              value: "500"
            - name: TESTID
              value: reco-constant
            - name: BASE_URL
              value: http://recommendation-service.service-launchpad-reco.svc.cluster.local:8080
            - name: K6_PROMETHEUS_RW_SERVER_URL
              value: http://vmagent.service-launchpad-observability.svc.cluster.local:8429/api/v1/write
            - name: K6_PROMETHEUS_RW_TREND_STATS
              value: p(50),p(95),p(99),max
            - name: K6_PROMETHEUS_RW_PUSH_INTERVAL
              value: 5s
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: script
          configMap:
            name: k6-recommendation-script
