apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../monitoring

images:
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    newName: europe-west10-docker.pkg.dev/geofaas-411316/service-launchpad/kube-state-metrics
    newTag: v2.13.0

patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
  - target:
      kind: Namespace
      name: service-launchpad-observability
    patch: |-
      - op: add
        path: /metadata/labels/app.kubernetes.io~1environment
        value: prod
  - target:
      kind: ConfigMap
      name: vmagent-config
    patch: |-
      - op: replace
        path: /data/prometheus.yml
        value: |
          global:
            scrape_interval: 15s
          scrape_configs:
            - job_name: vmagent
              static_configs:
                - targets:
                    - localhost:8429
            - job_name: victoriametrics
              static_configs:
                - targets:
                    - victoriametrics.service-launchpad-observability.svc.cluster.local:8428
            - job_name: mimir
              metrics_path: /metrics
              static_configs:
                - targets:
                    - mimir.service-launchpad-observability.svc.cluster.local:9009
            - job_name: kube-state-metrics
              static_configs:
                - targets:
                    - kube-state-metrics.service-launchpad-observability.svc.cluster.local:8080
            - job_name: fastapi-service
              metrics_path: /metrics
              static_configs:
                - targets:
                    - fastapi-service.service-launchpad-prod.svc.cluster.local:8000
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 192Mi
  - target:
      kind: Deployment
      name: kube-state-metrics
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 32Mi
  - target:
      kind: Deployment
      name: loki
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
  - target:
      kind: Deployment
      name: mimir
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
  - target:
      kind: Deployment
      name: tempo
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: Deployment
      name: victoriametrics
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 96Mi
  - target:
      kind: Deployment
      name: vmagent
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 10m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
  - target:
      kind: DaemonSet
      name: promtail
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
