# Default values reproduce what `kubectl kustomize k8s/base` renders today,
# except the Namespace object: Helm installs into the release namespace
# (`helm install -n <ns> --create-namespace`) instead of owning it.

nameOverride: ""
fullnameOverride: ""

image:
  repository: service-launchpad/fastapi-service
  tag: dev
  pullPolicy: IfNotPresent

# Ignored while autoscaling.enabled is true (the HPA owns the replica count).
replicaCount: 1

containerPort: 8000

service:
  type: ClusterIP
  port: 8000

# Rendered into the ConfigMap and loaded with envFrom.
config:
  model: tinyllama-1.1b-chat-q4_k_m
  defaultProfile: medium
  logLevel: INFO
  otel:
    serviceName: fastapi-service
    # Empty string disables trace export (spans are still created, so trace IDs
    # still appear in logs and responses).
    tracesEndpoint: http://tempo.service-launchpad-observability.svc.cluster.local:4318/v1/traces

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 60

probes:
  startup:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 12
  readiness:
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 3
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 15
    timeoutSeconds: 2
    failureThreshold: 10

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 256Mi

podAnnotations: {}
