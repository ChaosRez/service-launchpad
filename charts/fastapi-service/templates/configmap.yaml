apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fastapi-service.fullname" . }}-config
  labels:
    {{- include "fastapi-service.labels" . | nindent 4 }}
data:
  FASTAPI_SERVICE_MODEL: {{ .Values.config.model | quote }}
  FASTAPI_SERVICE_DEFAULT_PROFILE: {{ .Values.config.defaultProfile | quote }}
  FASTAPI_SERVICE_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otel.serviceName | quote }}
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.otel.tracesEndpoint | quote }}
