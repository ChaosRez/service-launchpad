name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  control-plane:
    name: Go control plane
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l services/control-plane)"

      - name: Run Go tests
        run: go test ./services/control-plane

      - name: Build control-plane image
        run: docker build -f services/control-plane/Dockerfile -t service-launchpad/control-plane:ci .

  fastapi-service:
    name: FastAPI service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fastapi-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/fastapi-service/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Build FastAPI image
        run: docker build -t service-launchpad/fastapi-service:ci .

  terraform:
    name: Terraform dev
    runs-on: ubuntu-latest
    env:
      TF_VAR_project_id: service-launchpad-ci
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..

      - name: Initialize Terraform without backend
        run: terraform init -backend=false

      - name: Validate Terraform
        run: terraform validate

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1

      - name: Render base manifests
        run: kubectl kustomize k8s/base >"${RUNNER_TEMP}/service-launchpad-base.yaml"

      - name: Render monitoring manifests
        run: kubectl kustomize k8s/monitoring >"${RUNNER_TEMP}/service-launchpad-monitoring.yaml"

      - name: Render production workload overlay
        run: kubectl kustomize k8s/overlays/prod >"${RUNNER_TEMP}/service-launchpad-prod.yaml"

      - name: Render production observability overlay
        run: kubectl kustomize k8s/overlays/prod-observability >"${RUNNER_TEMP}/service-launchpad-prod-observability.yaml"

      - name: Validate base manifests
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /manifests/service-launchpad-base.yaml

      - name: Validate monitoring manifests
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /manifests/service-launchpad-monitoring.yaml

      - name: Validate production workload overlay
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /manifests/service-launchpad-prod.yaml

      - name: Validate production observability overlay
        run: |
          docker run --rm \
            -v "${RUNNER_TEMP}:/manifests:ro" \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict \
            -summary \
            /manifests/service-launchpad-prod-observability.yaml
